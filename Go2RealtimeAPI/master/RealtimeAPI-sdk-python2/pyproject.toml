[project]
name = "audio-client"
version = "0.1.0"
description = "Python WebSocket Audio Client for Air Gateway"
requires-python = "==3.10.*"
dependencies = [
    "websockets>=12.0",
    "sounddevice>=0.4.6",
    "numpy>=1.26.0",
    "aiofiles>=25.1.0",
    "dashscope>=1.25.13",
    "torch>=2.10.0",
    "torchaudio>=2.10.0",
    "unitree-sdk2py",
    "openai>=2.29.0",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audio_client"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I"]

[tool.black]
line-length = 100

[tool.uv.workspace]
members = [
    "unitree_sdk2_python-master",
]

[tool.uv.sources]
unitree-sdk2py = { workspace = true, editable = true }

